<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página de Teste</title>
  <style>
    body { font-family: system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; margin: 0; background: #f4f4f8; color: #222; }
    main { text-align: center; padding: 2rem; background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.1); }
    button { padding: .6rem 1.2rem; border: 0; border-radius: 8px; background: #4f46e5; color: #fff; font-size: 1rem; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>Página de Teste</h1>
    <p>Se você está vendo isto, o index.html funciona.</p>
    <button id="btn">Clique aqui</button>
    <p id="out"></p>
  </main>
  <script>
    let n = 0;
    document.getElementById('btn').addEventListener('click', () => {
      document.getElementById('out').textContent = `Cliques: ${++n}`;
    });
  </script>
</body>
</html>
